name: Feature request
description: 提一个想法或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的不便
      description: 先讲场景，再讲方案。
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你希望怎么解决
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: scope
    attributes:
      label: 边界
      options:
        - label: 我愿意提 PR 实现
