# 任务完成音效与提醒（Task sounds & reminder）
#
# 装好即在左侧边栏多一个喇叭图标（与「插件」「自动化任务」同级），点开是音效设置面板。
#
# 两套音效互不相干：
#   - 音效池 A：每次回复结束随机播一个，同时起一个 5 分钟倒计时；
#   - 音效 B：倒计时走到头、期间没有任何新消息/新任务/新对话，才补响一次，一次任务只响一次。
#
# 状态文件与音频：<DSH home>/task-sfx/config.json 与 <DSH home>/task-sfx/sounds/，
# 与插件代码分开放，卸载、升级插件都不会丢音频。
#
# 插件自带空配置，绝不打断启动；无需任何账号或密钥。

- insert:
    - id: dsh-task-sfx
      name: dsh-task-sfx
      config: {}
